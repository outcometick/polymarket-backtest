name: verify

on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The floor pyproject advertises, and what the hosted sandbox runs.
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install .
      - run: python -m unittest discover -s tests -v

  equivalence:
    # This package against the JavaScript implementation of the same version,
    # on synthetic archives built to hold the awkward cases (docs/verification.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: npm install --no-save "outcometick@$(node -p "require('./verify/version.json').version")"
      - run: node --test 'verify/*.test.mjs'
